[project]
name = "s-rag"
version = "0.1.0"
description = "Evidence-aware local RAG and controlled handover acceptance testing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "docling>=2.0",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "numpy>=2.0",
    "ollama>=0.5",
    "orjson>=3.10",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.32",
    "rich>=13.9",
    "tenacity>=9.0",
    "typer>=0.15",
    "typesafe-sdk>=0.5.7",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
srag = "srag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srag"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
