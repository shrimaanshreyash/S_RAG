name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install Python and dependencies
        shell: powershell
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --group dev

      - name: Fetch pinned public benchmark corpus
        shell: powershell
        run: .\scripts\fetch_gitlab_runbooks_corpus.ps1

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q

      - name: Check browser JavaScript
        run: node --check src/srag/web/app.js
